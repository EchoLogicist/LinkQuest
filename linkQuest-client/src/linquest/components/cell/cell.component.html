<div class="cell" [style]="{'width': cellSide,'height': cellSide}">
    <div class="horizontal-block" >
        <div class="position-relative">            
            <div class="cell-dot-container"  [style]="{'background' :  getColor('Top')}" (click)="markCell('Top')">
                <div class="cell-dot" [style]="{'width' :  thickness, 'height': thickness, 'border-radius': thickness}"></div>
                <div class="cell-dot" [style]="{'width' :  thickness, 'height': thickness, 'border-radius': thickness}"></div>
            </div>
            <div class="cell-wall" [style]="{'height':thickness}"></div>
        </div>
         <div class="position-relative">
            <div class="cell-dot-container"  [style]="{'background' :  getColor('Bottom')}" (click)="markCell('Bottom')">
                <div class="cell-dot" [style]="{'width' :  thickness, 'height': thickness, 'border-radius': thickness}"></div>
                <div class="cell-dot" [style]="{'width' :  thickness, 'height': thickness, 'border-radius': thickness}"></div>
            </div>
            <div class="cell-wall" [style]="{'height':thickness}"></div>
        </div>
    </div>
    <div class="vertical-block">
        <div>
            <div class="cell-wall" [style]="{'background' :  getColor('Left'), 'width': thickness}" (click)="markCell('Left')"></div>
        </div>
        <div>
            <div class="cell-wall"  [style]="{'background' :  getColor('Right'), 'width': thickness}" (click)="markCell('Right')"></div>
        </div>
    </div>
</div>
